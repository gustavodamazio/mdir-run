name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers the workflow on tags prefixed with 'v', e.g., v1.0.0

env:
  FYNE_CROSS_VERSION: v1.6.3

jobs:
  # macOS precisa de CGO nativo (Cocoa/OpenGL), então roda num runner macOS.
  build-darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build macOS binaries (amd64 + arm64)
        run: make build-darwin

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: bin-darwin
          path: bin/mdir-run-darwin-*
          if-no-files-found: error

  # Linux e Windows são compilados via fyne-cross (Docker já vem no runner Ubuntu).
  build-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        os: [linux, windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@${{ env.FYNE_CROSS_VERSION }}

      - name: Build ${{ matrix.os }} binaries (amd64 + arm64)
        run: make build-${{ matrix.os }}

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.os }}
          path: bin/mdir-run-${{ matrix.os }}-*
          if-no-files-found: error

  release:
    needs: [build-darwin, build-cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necessário para criar a release e anexar os arquivos
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true

      # Artefatos do GitHub não preservam a permissão de execução.
      - name: Restore execute permissions
        run: chmod +x bin/mdir-run-*

      - name: Package binaries
        run: make package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # Tags com hífen (ex.: v1.3.0-rc1) viram pré-release e não ficam como "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
